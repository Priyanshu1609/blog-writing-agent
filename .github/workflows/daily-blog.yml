name: Daily Blog Generation

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Generate daily news blog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m main --news --topic "Latest tech news"

      - name: Commit to blogs branch
        run: |
          git fetch origin blogs || true
          git checkout -B blogs
          git add outputs || true
          git commit -m "Daily blog $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin blogs
